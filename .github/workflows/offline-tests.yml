name: Offline safety checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install static check tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq shellcheck openssh-client
          python -m pip install pyflakes==3.4.0
      - name: Lint
        run: |
          python -m pyflakes bin/*.py tests/*.py
          for file in bin/* tests/*.sh; do
            if head -n 1 "$file" | grep -q 'env bash'; then
              shellcheck "$file"
            fi
          done
      - name: Offline regression tests
        run: bash tests/run-all.sh
