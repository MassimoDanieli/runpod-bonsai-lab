name: Offline safety checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install static check tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq shellcheck openssh-client
          python -m pip install pyflakes==3.4.0
      - name: Lint
        run: |
          python -m pyflakes bin/*.py tests/*.py
          for file in bin/* tests/*.sh; do
            if head -n 1 "$file" | grep -q 'env bash'; then
              shellcheck "$file"
            fi
          done
      - name: Offline regression tests
        run: bash tests/run-all.sh
